
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Component Based</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
        }

        .heading {
            margin-bottom: 24px;
            text-align: center;
        }

        .heading h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
            font-size: 14px;
        }

        .card {
            width: 100%;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .profile-photo {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #dbeafe;
        }

        .profile-name {
            margin: 16px 0 8px;
            font-size: 24px;
        }

        .profile-nim {
            margin: 0 0 20px;
            color: #64748b;
            font-size: 15px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 400px) {
            body {
                padding: 16px;
            }

            .container {
                margin: 24px auto;
            }

            .card {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="heading">
            <h1>Profil Mahasiswa</h1>
            <p>Component-Based Styling</p>
        </header>

        <article class="card">
            <img
                class="profile-photo"
                src="foto.jpeg"
                alt="Foto profil Kukuh"
            >
            <h2 class="profile-name">Kukuh Dwi Nur Cahyo</h2>
            <p class="profile-nim">NIM: 2024520018</p>
            <a class="btn" href="#profil">Lihat Profil</a>
        </article>
    </main>
</body>
</html>
